<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar Admin</title><style>body{font:16px system-ui;margin:0;background:#f5f6f8;color:#16181d}.wrap{max-width:1100px;margin:auto;padding:28px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,table{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 12px #00000010}.num{font-size:32px;font-weight:800}table{width:100%;margin-top:18px;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #eee;text-align:left}button{padding:8px 12px;border:0;border-radius:9px;cursor:pointer}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style><div class="wrap"><h1>Daftar Admin</h1><div class="cards"><div class="card">Foydalanuvchilar<div id="users" class="num">—</div></div><div class="card">Kutilayotgan to‘lovlar<div id="pending" class="num">—</div></div><div class="card">Yozuvlar<div id="entries" class="num">—</div></div></div><h2>To‘lovlar</h2><table><thead><tr><th>Foydalanuvchi</th><th>Tarif</th><th>Summa</th><th>Status</th><th>Isbot</th><th>Amal</th></tr></thead><tbody id="payments"></tbody></table></div><script>const api=async(u,o)=>{const r=await fetch(u,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...o});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d};async function load(){const s=await api('/api/admin/summary');users.textContent=s.users;pending.textContent=s.pendingPayments;entries.textContent=s.entries;const p=await api('/api/admin/payments');payments.innerHTML=p.map(x=>`<tr><td>${x.username}</td><td>${x.plan}</td><td>${Number(x.amount).toLocaleString()} so‘m</td><td>${x.status}</td><td>${x.proofKey?`<a href="/api/admin/payment-proof/${encodeURIComponent(x.proofKey)}" target="_blank">Rasm</a>`:'—'}</td><td>${x.status==='pending'?`<button onclick="act('${x.id}','approve')">Tasdiqlash</button> <button onclick="act('${x.id}','reject')">Rad etish</button>`:'—'}</td></tr>`).join('')}async function act(id,a){await api('/api/admin/payments/'+id+'/'+a,{method:'POST'});load()}load().catch(e=>document.body.insertAdjacentHTML('beforeend','<p>'+e.message+'</p>'));</script></html>
