databases:
  - name: daftar-db
    plan: free
    databaseName: daftar
    user: daftar

services:
  - type: web
    name: daftar
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm run seed-admin && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: daftar-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SESSION_DAYS
        value: "30"
      - key: TRIAL_DAYS
        value: "7"
      - key: SUBSCRIPTION_DAYS
        value: "30"
      - key: PAYMENT_CARD
        sync: false
      - key: PAYMENT_HOLDER
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
